name: CI

# Validates every push to main and produces a runnable exe for testing.
# For a permanent, publicly downloadable build, tag a commit — see release.yml.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Build
        run: dotnet build Balatron/Balatron.csproj --configuration Release

      - name: Publish single-file exe
        run: dotnet publish Balatron/Balatron.csproj -c Release -p:PublishProfile=FolderProfile

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Balatron-${{ github.sha }}
          path: Balatron/bin/publish/Balatron.exe
          retention-days: 14
